codecov:
  notify:
    after_n_builds: 6
    wait_for_ci: false

  require_ci_to_pass: false
  token: 684c0bbe-e2c9-442e-9035-03d578ce4ea3 # notsecret  # repo-scoped, upload-only, stability in fork PRs

coverage:
  range: 40..100
  status:
    project:
      default:
        target: 60%
        threshold: 10%
      app:
        target: 60%
        threshold: 10%
        paths:
          - src/

    patch:
      default:
        target: 60%
        threshold: 10%
      app:
        target: 60%
        threshold: 10%
        paths:
          - src/
