codecov:
  notify:
    # ci.yml's `coverage` job sends every Python version's report in a single upload.
    after_n_builds: 1
    wait_for_ci: false

  require_ci_to_pass: false

coverage:
  range: 40..100
  status:
    project:
      default:
        target: 60%
        threshold: 10%
      app:
        target: 60%
        threshold: 10%
        paths:
          - src/

    patch:
      default:
        target: 60%
        threshold: 10%
      app:
        target: 60%
        threshold: 10%
        paths:
          - src/
