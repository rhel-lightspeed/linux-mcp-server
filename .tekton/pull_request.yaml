apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhel-lightspeed/linux-mcp-server?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{ revision }}'
    build.appstudio.redhat.com/pull_request_number: '{{ pull_request_number }}'
    build.appstudio.redhat.com/target_branch: '{{ target_branch }}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request"
      && target_branch.matches("^(main|release/.*|post-release/.*)$")

  creationTimestamp: null

  labels:
    appstudio.openshift.io/application: linux-mcp-server
    appstudio.openshift.io/component: linux-mcp-server
    pipelines.appstudio.openshift.io/type: build

  namespace: rhel-lightspeed-tenant
  name: linux-mcp-server-pr

spec:
  params:
    # Deliberately the upstream repository rather than `{{ source_url }}`: for a PR from a
    # fork, the fork has no release tags, so `git describe` in get-version finds nothing and
    # the version comes out as 0.1.dev<n>. GitHub serves a fork's PR head from the parent
    # repository's fork network, so the revision below still resolves.
    - name: git-url
      value: '{{ repo_url }}'

    - name: revision
      value: '{{ revision }}'

    - name: output-image
      value: quay.io/redhat-user-workloads/rhel-lightspeed-tenant/linux-mcp-server:pr-{{ pull_request_number }}-latest

    - name: dockerfile
      value: /Containerfile

    - name: hermetic
      value: "true"

    # Hermeto prefetch: pip sdists (no binary field = no binary SBOM annotations)
    # plus the build-toolchain RPMs (rpms.lock.yaml). hermetic builds compile
    # every wheel from source, so the network is fully isolated.
    - name: prefetch-input
      value: '[{"type": "pip", "path": ".", "requirements_files": [".konflux/requirements.txt"], "requirements_build_files": [".konflux/requirements-build.txt", ".konflux/requirements-build-1.txt"]}, {"type": "rpm", "path": "."}]'

    - name: image-expires-after
      value: 5d

    - name: tag-prefix
      value: pr-{{ pull_request_number }}-

  pipelineRef:
    name: pipeline-build-multiarch

  taskRunTemplate:
    serviceAccountName: build-pipeline-linux-mcp-server

  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
