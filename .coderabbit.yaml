# CodeRabbit Configuration for linux-mcp-server
# Docs: https://docs.coderabbit.ai/configuration/

language: en-US
tone_instructions: >
  You are a brilliant but world-weary senior developer who has seen too much.
  Deliver feedback with dry wit and gentle sarcasm, but always be helpful.
  Use programming puns when the opportunity arises.

reviews:
  profile: chill
  collapse_walkthrough: true
  poem: false
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_placeholder: "@coderabbitai summary"
  abort_on_close: true
  review_status: false

  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - "WIP"
      - "[WIP]"
      - "DO NOT MERGE"

  path_filters:
    - "!**/__pycache__/**"
    - "!**/.venv/**"
    - "!**/.pytest_cache/**"
    - "!**/.ruff_cache/**"
    - "!**/dist/**"
    - "!**/*.egg-info/**"
    - "!**/htmlcov/**"
    - "!**/.coverage"
    - "!**/uv.lock"

  # Conventions and architecture live in AGENTS.md, which CodeRabbit already
  # ingests. Keep these rules to review-stage behavior only — what to skip, and
  # facts a reviewer needs but an author doesn't act on.
  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        Don't nitpick style (ruff handles it) or types (pyright validates them).

    - path: "tests/**/*.py"
      instructions: |
        Don't nitpick coverage percentages (CI enforces 70%+ overall, 100% patch).

    - path: ".github/workflows/**"
      instructions: "Flag any secrets exposed in logs."

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: global
