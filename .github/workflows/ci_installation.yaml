name: Installation Validation

on:
  push:
    branches:
      - main
      - release-*
      - post-release-*
    paths:
      - 'src/linux_mcp_server/**'
      - 'scripts/verify_installation.sh'

  pull_request:
    paths:
      - 'src/linux_mcp_server/**'
      - 'scripts/verify_installation.sh'

# The install methods resolve dependencies fresh rather than from uv.lock, so
# this runs unreviewed third-party code - in the default branch's cache scope
# on a push to main. It must not get a write-capable token or save to the
# cache. See docs/development/ci-hardening.md.
permissions:
  contents: read
cache-mode: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FORCE_COLOR: 1

jobs:
  installation_qa:
    name: Install QA - ${{ matrix.method }} - Py ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
        method:
          - 'pip_user'
          - 'uvx_run'
          - 'uv_tool_run'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false
          
      - name: Run Installation and Verification
        shell: bash
        env:
          METHOD: ${{ matrix.method }}
          UV_PYTHON: python
        run: |
          chmod +x scripts/verify_installation.sh
          ./scripts/verify_installation.sh
