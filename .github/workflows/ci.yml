name: CI

on:
  push:
    branches:
      - main
      - release-*
      - post-release-*

  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  COVERAGE_IGOR_VERBOSE: 1
  FORCE_COLOR: 1    # Get colored pytest output


jobs:
  sanity:
    name: Sanity - ${{ matrix.test.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        test:
          - name: Type
            step_name: Check types
            command: pyright

          - name: Lint
            step_name: Run lint
            command: ruff check --diff

          - name: Format
            step_name: Run format check
            command: ruff format --diff

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false
      
      - name: Install dependencies
        run: uv sync --locked --group lint

      - name: "Show environment"
        run: |
          python -VV
          python -m site
          uv --version
          env | sort
          ls -ld $(python -c "import site; print(site.getsitepackages()[0])")
          whoami

      - name: ${{ matrix.test.step_name }}
        run: uv run --locked ${{ matrix.test.command }}

  tests:
    name: Unit - ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Show environment
        run: |
          set -x
          python -VV
          python -m site
          uv --version
          ls -ld $(python -c "import site; print(site.getsitepackages()[0])")
          whoami

      - name: Run tests
        run: uv run --locked pytest --cov-report=xml

      - name: Save coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage/coverage.xml
          if-no-files-found: error
          retention-days: 7

  # Uploads the reports saved by `tests` in one upload. Kept out of `tests` so the jobs that run
  # third-party code never hold `id-token: write`, and so they keep the cache.
  #
  # - Pushes (protected branches) authenticate with OIDC. There is no Codecov token anywhere.
  # - Pull requests, including ones from this repository, upload tokenless to an "unprotected"
  #   branch named `owner:branch`, which Codecov accepts from anyone for public repositories.
  #
  # Codecov checks no claim beyond `repository`, so OIDC here only keeps out fork PRs, which never
  # get `id-token: write`. Anyone with write access can upload as any branch, whatever this job
  # does.
  coverage:
    name: Upload coverage
    runs-on: ubuntu-latest
    needs: tests

    # Mints an OIDC token on pushes, so it gets no access to the cache.
    cache-mode: none

    permissions:
      contents: read
      id-token: write

    steps:
      # Codecov uses the file list (`git ls-files`) to map report paths. Nothing here runs code from
      # the checkout, and a pull request run holds no credential.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage

      - name: List coverage reports
        id: reports
        run: |
          files="$(find "$RUNNER_TEMP/coverage" -name coverage.xml | sort | paste -sd, -)"
          if [ -z "$files" ]; then
            echo "::error::No coverage reports were downloaded"
            exit 1
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: ${{ github.event_name == 'push' }}
          # `owner:branch` on pull requests, empty (detected from the push) otherwise. The action
          # only does this by itself for fork PRs, and only fills in the PR number for them too.
          override_branch: ${{ github.event.pull_request.head.label }}
          override_pr: ${{ github.event.pull_request.number }}
          disable_search: true
          files: ${{ steps.reports.outputs.files }}
          fail_ci_if_error: true
          flags: unittests
