name: Update Python requirements

# When a PR changes uv.lock, regenerate the Hermeto prefetch inputs
# (.konflux/requirements-* and the .tekton prefetch-input) with slushy-build so
# hermetic Konflux builds stay in sync with the resolved dependencies.
#
# For same-repo branches (Konflux MintMaker / Renovate / maintainers) the
# result is committed straight back to the PR, so no human has to run the tool
# and re-review a bot's follow-up commit. For fork PRs the token is read-only,
# so we instead fail with a diff and ask the author to run `make requirements-lock`.
on:
  pull_request:
    paths:
      - uv.lock

# A writable token lets us push to same-repo PR branches. GitHub automatically
# downgrades GITHUB_TOKEN to read-only (and withholds secrets) for fork PRs,
# which is exactly why this uses `pull_request` rather than
# `pull_request_target`: slushy-build shells out to `uv` to compile sdists
# (arbitrary code execution), and we must never run untrusted PR code with a
# privileged token.
permissions:
  contents: write

concurrency:
  group: update-python-requirements-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR's actual branch (on its own repo for forks) so we
          # run slushy-build against the uv.lock under review and can push back.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false

      - name: Run slushy-build
        run: |
          # Lock-file-maintenance PRs regenerate the whole uv.lock, so rebuild
          # the build requirements from scratch too. Regular single-dependency
          # bumps use an incremental update so unrelated build-req churn doesn't
          # sneak in.
          if [[ "${{ github.event.pull_request.head.ref }}" == */lock-file-maintenance ]]; then
            echo "Lock-file-maintenance branch detected: rebuilding from scratch."
            export SLUSHY_FROM_SCRATCH=1
          fi
          make requirements-lock

      - name: Check for changes
        id: diff
        run: |
          # Stage only the paths slushy-build owns, then diff against the index.
          # Staging first is what catches brand-new files (.konflux is generated,
          # and a dependency change can add a fresh requirements-build-N.txt) --
          # plain `git diff` ignores untracked files. Scoping the add also means
          # we never accidentally commit uv.lock or other stray changes.
          git add -A .konflux .tekton
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Konflux prefetch inputs already up to date with uv.lock."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat
          fi

      - name: Commit and push (same-repo PRs)
        if: >-
          steps.diff.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore: sync Konflux prefetch requirements with uv.lock" \
            -m "Generated by slushy-build via the update-python-requirements workflow."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Fail (fork PRs need a manual update)
        if: >-
          steps.diff.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::.konflux/.tekton are out of date with uv.lock. Run 'make requirements-lock' locally and commit the result."
          git --no-pager diff --cached
          exit 1
